[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fanbei-mcp"
version = "0.1.0"
description = "翻呗文档翻译 MCP Server：上传 · 报价 · 下单 · 查进度 · 下载"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sunny Translation", email = "support@sunnytranslation.com" }]
keywords = ["mcp", "translation", "document", "docx", "pdf", "翻呗"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "mcp>=2.3.0",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://trans.sunnytranslation.com"
Documentation = "https://trans.sunnytranslation.com/articles"
Source = "https://github.com/ee58594/fanbei-mcp"

[project.scripts]
fanbei-mcp = "fanbei_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["fanbei_mcp"]
